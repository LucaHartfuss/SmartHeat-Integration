[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["custom_components"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
