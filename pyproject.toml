[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# vulture-Ausnahmeliste: Namen ohne Definition, nur fuer vulture gelesen
"vulture_ausnahmen.py" = ["F821", "B018"]

[tool.pyright]
include = ["custom_components"]
exclude = ["**/.venv", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
