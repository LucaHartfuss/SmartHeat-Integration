name: CI
# Pruefstufen (Root-Runbook Abschnitt 3, Spec Testoffensive Nr. 30/35): alle Jobs gehoeren zur Standardstufe und laufen
# bei Push (alle Branches, oeffentliches Repo ohne Minutenkosten), im Tageslauf und im Release (stufe: voll) gleich; die
# Eingabe stufe ist deklariert, damit der Release-Workflow und workflow_dispatch sie wie in den anderen Repos uebergeben.
# hassfest und hacs sind Container-Actions, gehoeren als Pflicht-Checks des Rulesets aber ausdruecklich zur
# Standardstufe (Ausnahme der Docker-Regel in tools/tests/test_workflows.py des Root-Repos). Pflicht-Checks (lint,
# test, hassfest, hacs, contract) bleiben Jobs ohne Job-if (sonst scheitert der Fast-Forward von main mit GH013).
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      stufe:
        description: "Prüfstufe: standard oder voll (hier gleich, alle Jobs gehören zur Standardstufe)"
        type: string
        required: false
        default: standard
  schedule:
    - cron: "47 3 * * *"
  workflow_call:
    inputs:
      stufe:
        description: "Prüfstufe: standard oder voll (hier gleich, alle Jobs gehören zur Standardstufe)"
        type: string
        required: false
        default: standard
    secrets:
      CROSS_REPO_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'develop' || '' }}
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt  # pin-check: ungehasht (CI ohne Schreibrecht, HA-Testumgebung)
      - run: PYTHON=python bash scripts/check.sh --only lint
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      # requirements_test.txt pinnt die phcc-Version von client1 (phcc 0.13.367 pinnt homeassistant==2026.9.4); sie
      # folgt HomeAssistantPapa/.HA_VERSION und wird mit dem HA-Pin in SmartHeat-for-HomeAssistant/.github/workflows/ci.yml
      # zusammen angehoben (docs/ci-cd-runbook.md; tools/ha_version_check.py prueft die Zeile unten).
      - run: pip install -r requirements_test.txt  # pin-check: ungehasht (CI ohne Schreibrecht, HA-Testumgebung)
      - name: HA-Testumgebung von client1 (HomeAssistantPapa/.HA_VERSION = 2026.9.4)
        run: |
          pip show homeassistant | grep -q '^Version: 2026\.9\.4$'
      - name: Taeglich gegen die neueste HA-Testumgebung (Spec 2.2)
        if: github.event_name == 'schedule'
        run: pip install -U pytest-homeassistant-custom-component  # pin-check: ungehasht (CI ohne Schreibrecht, HA-Testumgebung)
      - run: PYTHON=python bash scripts/check.sh --only test
  hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master (2026-10-01)
  hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main (2026-10-01)
        with:
          category: integration
          ignore: brands
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Dev-Root aufbauen
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          SIBLINGS_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}
        run: >-
          bash scripts/ci/siblings.sh "$RUNNER_TEMP/dev" SmartHeat-Integration "$GITHUB_WORKSPACE"
          "$SIBLINGS_REF"
          HeizungssteuerungServer SmartHeat-for-HomeAssistant
      - run: pip install -r "$DEV_ROOT/tools/requirements-dev.txt"  # pin-check: ungehasht (CI ohne Schreibrecht, HA-Testumgebung)
      - run: PYTHON=python bash scripts/check.sh --only contract
